[package]
name = "nct"
version = "0.1.0"
edition = "2024"
description = "nixos-config-tool: CLI for NixOS configuration management"

[[bin]]
name = "nct"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
nix-bindings-store = { git = "https://github.com/nixops4/nix-bindings-rust" }
nix-bindings-expr = { git = "https://github.com/nixops4/nix-bindings-rust" }
nix-bindings-flake = { git = "https://github.com/nixops4/nix-bindings-rust" }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
assert_cmd = "2"
