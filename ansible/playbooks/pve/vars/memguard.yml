---
# Log what would be killed and kill nothing. Switch to false only after a
# week of dry-run without false positives.
pve_memguard_dry_run: true

# Config keys to override, for example `headroom_threshold_bytes: 4294967296`.
# The defaults, and what each key means, are DEFAULT_CONFIG in
# files/pve_memguard.py. An unknown key or a wrong type fails the deploy.
pve_memguard_overrides: {}
