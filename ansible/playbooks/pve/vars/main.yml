---
zfs_exporter_version: '2.3.4'
# zfs_exporter_options: '--collector.dataset-snapshot'
node_exporter_textfile_dir: /var/lib/node_exporter
# Repeats the role defaults (systemd + textfile), because setting this replaces
# them rather than extending. The Aquacomputer OCTO on valak (hwmon chip "octo",
# aquacomputer_d5next) serialises every attribute read behind the driver mutex at
# ~7s each; with 119 attributes one hwmon walk takes ~14min, so scrapes wedge in
# uninterruptible sleep until they hit --web.max-requests=40 and the box reports a
# load average of ~150 while sitting 99% idle. Excluding a chip that is absent on
# the other PVE nodes is a no-op there.
node_exporter_enabled_collectors:
  - systemd
  - textfile:
      directory: "{{ node_exporter_textfile_dir }}"
  - hwmon:
      chip-exclude: '^octo'
vmagent_remote_write_host: http://192.168.2.2:8428
vmagent_scrape_config:
  global:
    external_labels:
      bhost: "{{ inventory_hostname }}"
  scrape_configs:
    - job_name: "node"
      scrape_interval: "10s"
      static_configs:
        - targets: ["127.0.0.1:9100"]
    - job_name: "zfs"
      scrape_interval: "10s"
      static_configs:
        - targets: ["127.0.0.1:9134"]
    - job_name: "vmagent"
      scrape_interval: "10s"
      static_configs:
        - targets: ["127.0.0.1:8429"]
